<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 200px;
            height: 100px;
            background-color: pink;
            border: 1px solid black ;
        }
        div#foo{
            transform: rotateZ(150deg);
        }
    </style>
</head>
<body>
    <div>This is box1</div>
    <p>Rotate Y-axis</p>
    <div id="foo">This is box2</div>
</body>
</html>
