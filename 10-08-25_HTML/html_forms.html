<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Html forms</title>
  <style>
        fieldset
        {   
            border: 3px solid black;
            background-color: orange;
            width: 200px;
            height: 200px;
            padding: 20px;
            margin: 20px;
        }
    </style>
</head>
<body>
  <form>
  <fieldset>
    <legend style="color: blueviolet; text-align: center;font-size: 1.5em;">Personal info</legend>
    <input type="text" placeholder="Only Name" name="Name"><br>  
    <input type="password" placeholder="Password" name="password">
 

  
    <legend style="color: rgb(214, 211, 32); text-align: center; font-size: 1.8em;">Favorite Color</legend>
    <input name="color" type="radio" value="blue"> Blue
    <input name="color" type="radio" value="green"> Green
    <input name="color" type="radio" value="red"> Red
    <input name="color" type="radio" value="yellow"> Yellow
  
    <input name="country" list="countries" placeholder="country">
    <datalist id="countries">
      <option value="Afganisthan">
      <option value="Albania">
      <option value="United States">
      <option value="Japan">
      <option value="India">
      <option value="England">
      <option value="Pakistan">
    </datalist>
  </fieldset>

  <input type="submit">
</form>
</body>
</html>
