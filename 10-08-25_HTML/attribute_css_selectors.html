<!DOCTYPE html>
<html lang="en">
<head>
    <title>attribute</title>
    <style>
        a{
            color: rgb(165, 200, 71);
        }
        a[href="https://www.facebook.com"]
        {
            color: rgb(143, 44, 120);
        }
        button
        {
           width: 200px; 
           background-color: rgb(216, 170, 21);
        }
        #foo
        {
            background-color: greenyellow;
        }
        button:hover
        {
            background-color: red;
        }
    </style>
</head>
<body>
    <ul>
        <li><a href="https://www.google.com"><button>Google</button></a></li>
        <li><a href="https://www.facebook.com"><button>Facebook</button></a></li>
        <li><a href="https://www.flipkart.com"><button>Flipkart</button></a></li>
        <li><a href="https://www.jiomart.com"><button>Jiomart</button></a></li>
    </ul>
</body>
</html>
